name: Build and Release YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload the installers to"
        required: true
        default: "v1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          $ffmpegBin = "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin"
          if (-not (Test-Path (Join-Path $ffmpegBin "ffmpeg.exe"))) {
            throw "ffmpeg.exe introuvable dans $ffmpegBin"
          }
          "FFMPEG_BIN_DIR=$ffmpegBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install --upgrade pip

      - name: Build EXE and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/packages/YouTubeDownloaderSetup.exe

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rpm dpkg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Linux packages
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/packages/*

  publish-release:
    needs: [windows-build, linux-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi

          echo "Publishing release for $RELEASE_TAG"
          ls -la release-assets/

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "YouTube Downloader $RELEASE_TAG" --notes "Version $RELEASE_TAG avec mise a jour automatique de yt-dlp, ffmpeg et ffprobe integres."
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

